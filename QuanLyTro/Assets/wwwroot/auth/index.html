<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Quản lý nhà trọ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/tokens.css?v=2" />
  <link rel="stylesheet" href="../shared/css/base.css?v=2" />
  <link rel="stylesheet" href="auth.css?v=3" />
</head>
<body>
  <div class="glass-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span><span class="orb orb-4"></span></div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <section id="s01" class="screen-view active">
    <div class="login-page">
      <div class="login-card-outer">
        <div class="login-card-inner">
          <h1 class="login-title">QUẢN LÝ NHÀ TRỌ</h1>
          <p class="login-subtitle">Phường Ngũ Hành Sơn — TP. Đà Nẵng</p>

          <div class="auth-tabs" role="tablist" aria-label="Chọn thao tác">
            <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true" aria-controls="panelLogin">Đăng nhập</button>
            <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false" aria-controls="panelRegister">Đăng ký khách thuê</button>
          </div>

          <div id="panelLogin" class="auth-panel" role="tabpanel" aria-labelledby="tabLogin">
            <form id="loginForm" novalidate>
              <div class="field">
                <label for="loginUsername">Tên đăng nhập</label>
                <input id="loginUsername" class="input" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập hoặc CCCD" required />
              </div>
              <div class="field">
                <label for="loginPassword">Mật khẩu</label>
                <div class="input-wrap">
                  <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
                  <button type="button" class="input-eye" id="togglePwdBtn" aria-label="Hiện hoặc ẩn mật khẩu">
                    <svg class="ms-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary auth-submit" id="btnLogin">Đăng nhập</button>
              <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
            </form>

            <div class="login-roles-hint" aria-label="Tài khoản demo">
              <label class="hint-label" for="demoAccountSelect">Tài khoản demo</label>
              <select class="input demo-account-select" id="demoAccountSelect">
                <option value="">Chọn vai trò để điền thông tin…</option>
                <option value="chutro">♛ Chủ trọ</option>
                <option value="quanly">♙ Quản lý</option>
                <option value="letan">▤ Lễ tân</option>
                <option value="nhanvien">⚒ Nhân viên</option>
                <option value="congan">⛨ Công an</option>
              </select>
            </div>
          </div>

          <div id="panelRegister" class="auth-panel" role="tabpanel" aria-labelledby="tabRegister" hidden>
            <form id="formRegister" novalidate>
              <div class="field"><label for="regHoTen">Họ tên</label><input id="regHoTen" class="input" placeholder="Nguyễn Văn A" required /></div>
              <div class="field-row">
                <div class="field"><label for="regNgaySinh">Ngày sinh</label><input id="regNgaySinh" class="input" type="date" required /></div>
                <div class="field"><label for="regSdt">Số điện thoại</label><input id="regSdt" class="input mono" placeholder="09xxxxxxxx" required /></div>
              </div>
              <div class="field"><label for="regCccd">Số CCCD (12 số, dùng làm tên đăng nhập)</label><input id="regCccd" class="input mono" maxlength="12" inputmode="numeric" placeholder="12 chữ số" required /></div>
              <div class="field"><label for="regQueQuan">Quê quán</label><input id="regQueQuan" class="input" placeholder="Xã/Phường, Quận/Huyện, Tỉnh" required /></div>
              <div class="field"><label for="regNoiLamViec">Nơi làm việc (không bắt buộc)</label><input id="regNoiLamViec" class="input" /></div>
              <div class="field"><label for="regMatKhau">Mật khẩu</label><input id="regMatKhau" class="input" type="password" autocomplete="new-password" placeholder="Từ 6 ký tự trở lên" required /></div>
              <button type="submit" class="btn btn-primary auth-submit" id="btnRegister">Tạo tài khoản</button>
              <div id="registerError" class="login-error" role="alert" aria-live="polite"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div class="modal-backdrop" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="card-header" style="margin-bottom:12px;"><h2 class="card-title" id="modalTitle">Thông báo</h2><button type="button" class="icon-btn" id="closeModalBtn" aria-label="Đóng">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="../shared/js/bridge.js?v=2"></script>
  <script src="../shared/js/ui.js?v=2"></script>
  <script src="../shared/js/chrome.js?v=2"></script>
  <script src="auth.js?v=3"></script>
</body>
</html>
