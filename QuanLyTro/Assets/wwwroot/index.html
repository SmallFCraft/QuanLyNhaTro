<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quản lý nhà trọ — Đăng nhập</title>
<link rel="stylesheet" href="shared/css/app.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>QUẢN LÝ NHÀ TRỌ</h1>
    <p class="sub">Phường Ngũ Hành Sơn — TP. Đà Nẵng</p>

    <label for="tenDangNhap">Tên đăng nhập</label>
    <input id="tenDangNhap" type="text" autocomplete="username">

    <label for="matKhau">Mật khẩu</label>
    <input id="matKhau" type="password" autocomplete="current-password">

    <button id="btnDangNhap" type="button">Đăng nhập</button>
    <p id="loi" class="error" role="alert" hidden></p>
  </div>

  <script src="shared/js/api.js"></script>
  <script>
    document.getElementById('btnDangNhap').addEventListener('click', async () => {
      const loi = document.getElementById('loi');
      loi.hidden = true;
      const resp = await api.call('DANG_NHAP', {
        tenDangNhap: document.getElementById('tenDangNhap').value.trim(),
        matKhau: document.getElementById('matKhau').value,
      });
      if (!resp.success) { loi.textContent = resp.message; loi.hidden = false; }
    });
    // Enter để đăng nhập
    document.getElementById('matKhau').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btnDangNhap').click();
    });
  </script>
</body>
</html>
