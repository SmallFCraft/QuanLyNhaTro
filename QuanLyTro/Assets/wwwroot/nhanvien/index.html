<html lang="vi">
<head>

  <div class="glass-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span><span class="orb orb-4"></span></div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <section id="s03" class="screen-view active">
<div class="app-shell">
          <aside class="sidebar" id="sidebarS03" aria-label="Menu Nhân viên">
            <div class="sidebar-brand">
              <div class="brand-left">
                <div class="brand-mark">NV</div>
                <div><div class="brand-text-title">QUẢN LÝ NHÀ TRỌ</div><div class="brand-text-sub">Module Nhân viên</div></div>
              </div>

            </div>
            <ul class="sidebar-nav">
              <li><button type="button" class="nav-btn active" data-goto="s03"><span>Việc được giao</span></button></li>
            </ul>
            <div class="sidebar-footer"><span>TCP 8888</span><span>Nhân viên</span></div>
          </aside>

          <div class="shell-main">
            <header class="userbar">
              <div class="userbar-left">
                <button type="button" class="menu-toggle-btn" data-open-drawer="sidebarS03" aria-label="Mở menu">
                  <svg class="ms-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
                </button>
                <span class="userbar-context">Module Nhân viên</span>
              </div>
              <div class="userbar-right">
                <button type="button" class="conn-status"><span class="conn-dot"></span><span>Trực tuyến</span></button>
                <span class="user-name" id="pname">Nhân viên</span>
                <span class="role-pill">Nhân viên</span>
                <button type="button" class="icon-btn danger" data-goto="s01" title="Đăng xuất" aria-label="Đăng xuất">
                  <svg class="ms-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M10 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h6v-2H5V5h5V3zm4 4-1.4 1.4L15.2 11H9v2h6.2l-2.6 2.6L14 17l5-5-5-5z"/></svg>
                </button>
              </div>
            </header>
            <main class="content-wrap" style="padding:16px;">
<div class="headline"><div class="l"><h1 id="ptitle">Việc được giao</h1></div></div>
<div class="tabs"><div class="tab on" data-ntab="viec" onclick="loadNhanVienTab('viec')">Việc của tôi <span class="cnt" id="cnt-viec">0</span></div></div>
<div class="content"><div id="ntab-viec"><p style="color:var(--dim)">Đang tải việc…</p></div></div>
            </main>
          </div>
</div>
  </section>
  <div class="modal-backdrop" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="card-header" style="margin-bottom:12px;"><h2 class="card-title" id="modalTitle">Thông báo</h2><button type="button" class="icon-btn" id="closeModalBtn" aria-label="Đóng">✕</button></div>
      <div id="modalBody"></div>
    </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
