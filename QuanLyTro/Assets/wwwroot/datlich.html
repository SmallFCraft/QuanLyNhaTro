<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lịch xem phòng — Quản lý nhà trọ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/css/tokens.css?v=2" />
  <link rel="stylesheet" href="shared/css/base.css?v=2" />
</head>
<body>
  <div class="glass-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span><span class="orb orb-4"></span></div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <section id="s08b" class="screen-view active">
<div class="public-page">
          <header class="public-header">
            <div>
              <div style="font-size:15px; font-weight:700; color:var(--navy);">QUẢN LÝ NHÀ TRỌ</div>
              <div style="font-size:11px; color:var(--text-muted);">Phường Ngũ Hành Sơn — TP. Đà Nẵng</div>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" data-goto="s01">Đăng nhập</button>
          </header>
          <div class="public-hero">
            <div class="public-hero-inner">
              <h1>Xem phòng trọ quanh Ngũ Hành Sơn</h1>
              <p>Phòng trống cập nhật trực tiếp — đặt lịch hẹn xem phòng không cần tài khoản.</p>
            </div>
          </div>
          <div class="public-body">
            <div class="vacant-grid" id="publicVacantGrid"></div>
            <div class="card">
              <div class="card-header"><h2 class="card-title">Đặt lịch xem phòng</h2></div>
              <form id="publicBookingForm" novalidate>
                <div class="field"><label for="bookHoTen">Họ tên</label><input id="bookHoTen" class="input" required /></div>
                <div class="field"><label for="bookSdt">SĐT</label><input id="bookSdt" class="input mono" required /></div>
                <div class="field">
                  <label for="bookPhong">Chọn phòng</label>
                  <select id="bookPhong" class="select">
                    <option value="103">Phòng 103 — Khu A (2.500.000 đ/tháng)</option>
                    <option value="106">Phòng 106 — Khu A (2.300.000 đ/tháng)</option>
                    <option value="202">Phòng 202 — Khu B (2.700.000 đ/tháng)</option>
                    <option value="205">Phòng 205 — Khu B (2.500.000 đ/tháng)</option>
                  </select>
                </div>
                <div class="field"><label for="bookThoiGian">Thời gian</label><input id="bookThoiGian" class="input" type="datetime-local" value="2026-11-22T09:30" required /></div>
                <div id="bookingFeedback" style="font-size:13px; font-weight:600; min-height:20px; margin-bottom:6px;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Gửi yêu cầu</button>
                <p class="helper-text" style="text-align:center;">Không quá 3 yêu cầu chờ duyệt mỗi ngày từ một số điện thoại</p>
              </form>
            </div>
          </div>
        </div>
  </section>
  <div class="modal-backdrop" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="card-header" style="margin-bottom:12px;"><h2 class="card-title" id="modalTitle">Thông báo</h2><button type="button" class="icon-btn" id="closeModalBtn" aria-label="Đóng">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="shared/js/bridge.js?v=2"></script>
  <script>
    (function () {
      const fallbackVacantRooms = [
        { phongId: 103, soPhong: "103", tenKhu: "Khu A", giaThue: 2500000 },
        { phongId: 106, soPhong: "106", tenKhu: "Khu A", giaThue: 2300000 },
        { phongId: 202, soPhong: "202", tenKhu: "Khu B", giaThue: 2700000 },
        { phongId: 205, soPhong: "205", tenKhu: "Khu B", giaThue: 2500000 }
      ];

      let vacantRooms = [];

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function formatVnd(n) {
        const v = Number(n);
        return (Number.isFinite(v) ? v.toLocaleString("vi-VN") : "0") + " đ";
      }

      function showToast(msg) {
        const stack = document.getElementById("toastStack");
        if (!stack) return;
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        stack.appendChild(el);
        setTimeout(function () { el.remove(); }, 3200);
      }

      function setDefaultBookingTime() {
        const inp = document.getElementById("bookThoiGian");
        if (!inp) return;
        const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
        tomorrow.setHours(9, 30, 0, 0);
        const pad = function (n) { return String(n).padStart(2, "0"); };
        inp.value = tomorrow.getFullYear() + "-" +
          pad(tomorrow.getMonth() + 1) + "-" +
          pad(tomorrow.getDate()) + "T" +
          pad(tomorrow.getHours()) + ":" +
          pad(tomorrow.getMinutes());
      }

      function renderVacantRooms(rooms) {
        vacantRooms = Array.isArray(rooms) ? rooms : [];
        const grid = document.getElementById("publicVacantGrid");
        const sel = document.getElementById("bookPhong");

        if (grid) {
          if (vacantRooms.length === 0) {
            grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:var(--text-muted);">Hiện chưa có phòng trống.</div>';
          } else {
            grid.innerHTML = vacantRooms.map(function (r) {
              const pid = r.phongId ?? r.id ?? r.soPhong;
              return '<div class="vacant-card">' +
                '<div style="display:flex; justify-content:space-between; align-items:center;">' +
                  '<span class="vacant-room-num">Phòng ' + esc(r.soPhong) + '</span>' +
                  '<span class="pill pill-green">Trống</span>' +
                '</div>' +
                '<div class="helper-text">' + esc(r.tenKhu) + '</div>' +
                '<div class="mono font-bold text-navy" style="font-size:16px;">' + esc(formatVnd(r.giaThue)) + '/tháng</div>' +
                '<button type="button" class="btn btn-primary btn-sm" data-pick-room="' + esc(pid) + '">Đặt lịch xem</button>' +
              '</div>';
            }).join("");
          }
        }

        if (sel && vacantRooms.length > 0) {
          sel.innerHTML = vacantRooms.map(function (r) {
            const pid = r.phongId ?? r.id ?? r.soPhong;
            return '<option value="' + esc(pid) + '">Phòng ' + esc(r.soPhong) + ' — ' + esc(r.tenKhu) + ' (' + esc(formatVnd(r.giaThue)) + '/tháng)</option>';
          }).join("");
        }
      }

      async function loadVacantRooms() {
        try {
          const res = await window.QuanLyTroBridge.invoke("PHONG_LAY_TRONG_PUBLIC", {});
          const data = res && res.data;
          if (Array.isArray(data)) {
            renderVacantRooms(data);
          } else {
            renderVacantRooms(fallbackVacantRooms);
          }
        } catch (err) {
          renderVacantRooms([]);
          showToast(err.message || "Không tải được danh sách phòng trống.");
        }
      }

      document.getElementById("publicVacantGrid")?.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-pick-room]");
        if (!btn) return;
        const sel = document.getElementById("bookPhong");
        if (sel) sel.value = btn.dataset.pickRoom;
        document.getElementById("bookHoTen")?.focus();
      });

      document.querySelector('[data-goto="s01"]')?.addEventListener("click", function () {
        window.location.href = "auth/index.html";
      });

      document.getElementById("closeModalBtn")?.addEventListener("click", function () {
        document.getElementById("appModal")?.classList.remove("open");
      });

      document.getElementById("publicBookingForm")?.addEventListener("submit", async function (e) {
        e.preventDefault();
        const hoTen = (document.getElementById("bookHoTen")?.value || "").trim();
        const soDienThoai = (document.getElementById("bookSdt")?.value || "").trim();
        const phongId = Number(document.getElementById("bookPhong")?.value);
        const thoiGian = (document.getElementById("bookThoiGian")?.value || "").trim();
        const fb = document.getElementById("bookingFeedback");

        if (!hoTen || !soDienThoai || !phongId || !thoiGian) {
          if (fb) {
            fb.style.color = "var(--red-text)";
            fb.textContent = "Vui lòng nhập đầy đủ họ tên, số điện thoại, phòng và thời gian.";
          }
          return;
        }

        try {
          const res = await window.QuanLyTroBridge.invoke("KHACH_THUE_DAT_LICH", {
            phongId: phongId,
            hoTen: hoTen,
            soDienThoai: soDienThoai,
            thoiGian: thoiGian
          });
          if (res && res.success === false) {
            throw new Error(res.message || "Không thể đặt lịch xem phòng.");
          }
          const picked = vacantRooms.find(function (r) { return Number(r.phongId ?? r.id) === phongId; });
          const labelPhong = picked ? picked.soPhong : String(phongId);
          if (fb) {
            fb.style.color = "var(--green-text)";
            fb.textContent = "Đã gửi yêu cầu xem Phòng " + labelPhong + " (Chờ duyệt).";
          }
          showToast("Đặt lịch xem phòng thành công!");
        } catch (err) {
          if (fb) {
            fb.style.color = "var(--red-text)";
            fb.textContent = err.message || "Đặt lịch thất bại.";
          }
          showToast(err.message || "Đặt lịch thất bại.");
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        setDefaultBookingTime();
        loadVacantRooms();
      });
    })();
  </script>
</body>
</html>
